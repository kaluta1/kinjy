<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kinjy — the AI-powered global social operating system. Social networking, forums, family trees, memorials, creator earnings, commerce and AI agents in one elegant ecosystem." />
    <meta name="theme-color" content="#0B0E1D" />

    <!-- Icons. The SVG is the sharp one and Chrome and Firefox prefer it; the
         rest of the world (iOS, Windows tiles, most link-preview crawlers, any
         browser older than a couple of years) only reads raster, so the PNGs
         and the .ico are not redundant. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews. Crawlers for WhatsApp, Slack, iMessage, LinkedIn,
         Facebook and X fetch the HTML and never run the JavaScript, so these
         have to be here in the served document — a React component setting
         them at runtime is invisible to every one of them. og:image must be an
         absolute URL for the same reason. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinjy" />
    <meta property="og:title" content="Kinjy — One world. Every connection." />
    <meta property="og:description" content="Social, forums, family trees, memorials, commerce and AI agents — in one elegant ecosystem." />
    <meta property="og:url" content="https://kinjy.com/" />
    <meta property="og:image" content="https://kinjy.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kinjy logomark beside the words One world. Every connection." />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kinjy — One world. Every connection." />
    <meta name="twitter:description" content="Social, forums, family trees, memorials, commerce and AI agents — in one elegant ecosystem." />
    <meta name="twitter:image" content="https://kinjy.com/og-image.png" />
    <meta name="twitter:image:alt" content="The Kinjy logomark beside the words One world. Every connection." />

    <link rel="canonical" href="https://kinjy.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Manrope:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <title>Kinjy — AI-Powered Global Social Operating System</title>
    <!-- Before anything paints: the remembered light/dark choice (public/theme-init.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
